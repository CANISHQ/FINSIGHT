<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FinSight AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
:root{--bg:#0a1224;--s1:#0f1a33;--s2:#142243;--bd:#223157;--tx:#e8edf7;--mu:#8e9bbb;--ac:#5b8cff;--up:#2fcf8e;--dn:#ff6b6b;--wn:#f5b942;--r:10px;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#f3f5fa;--s1:#fff;--s2:#eaeef7;--bd:#d5dbe9;--tx:#0f1a33;--mu:#5d6a88;--ac:#2557d6;--up:#0f9d63;--dn:#d93a3a;--wn:#b97a00;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:Newsreader,Georgia,serif;font-weight:600;margin:0;letter-spacing:-.01em}h1{font-size:clamp(30px,5vw,52px);line-height:1.1}h2{font-size:24px}h3{font-size:17px;font-family:Figtree,sans-serif}
button,input,select{font:inherit;color:inherit}a{color:var(--ac);text-decoration:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--s1);border-right:1px solid var(--bd);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{font:600 20px Newsreader,serif;padding:4px 10px 16px}.logo b{color:var(--ac)}
.nav a{display:block;padding:8px 10px;border-radius:8px;color:var(--mu);font-weight:500;margin-bottom:2px}
.nav a:hover{background:var(--s2);color:var(--tx)}.nav a.on{background:var(--s2);color:var(--tx);box-shadow:inset 3px 0 var(--ac)}
.nav small{display:block;margin:14px 10px 4px;color:var(--mu);font-size:12px}
.top{display:flex;gap:10px;align-items:center;padding:12px 24px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:5}
.top .menu{display:none}.main{padding:24px;max-width:1280px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.sm{padding:4px 10px;font-size:13px}
.in{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:9px 12px;width:100%}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.mu{color:var(--mu)}.up{color:var(--up)}.dn{color:var(--dn)}.num{font-variant-numeric:tabular-nums}
.big{font:600 28px Newsreader,serif}.demo{background:color-mix(in srgb,var(--wn) 15%,transparent);border:1px solid var(--wn);color:var(--wn);border-radius:8px;padding:6px 12px;font-size:13px;margin-bottom:16px}
.tag{border:1px solid var(--bd);border-radius:99px;padding:1px 9px;font-size:12px;color:var(--mu)}
.t{width:100%;border-collapse:collapse}.t th,.t td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}.t th:first-child,.t td:first-child{text-align:left}.t th{color:var(--mu);font-weight:500}
.sc{overflow-x:auto}.tabs{display:flex;gap:4px;margin:12px 0}.tabs button{background:none;border:1px solid var(--bd);border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--mu)}.tabs .on{background:var(--s2);color:var(--tx)}
.sk{background:linear-gradient(90deg,var(--s1),var(--s2),var(--s1));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:8px;height:90px;margin-bottom:12px}@keyframes sh{to{background-position:-200% 0}}
.empty,.err{text-align:center;padding:36px 16px;border:1px dashed var(--bd);border-radius:var(--r);color:var(--mu)}.err{border-color:var(--dn)}
.msg{padding:10px 14px;border-radius:10px;margin-bottom:10px;max-width:760px}.msg.u{background:var(--s2);margin-left:auto}.msg.a{background:var(--s1);border:1px solid var(--bd)}
.flag{border-left:4px solid var(--wn)}.flag.High{border-color:var(--dn)}.flag.Low,.flag.Informational{border-color:var(--ac)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:20px;background:var(--s2);border:1px solid var(--bd);padding:10px 16px;border-radius:8px;z-index:20}
.land{max-width:1060px;margin:0 auto;padding:0 20px 60px}.hero{padding:70px 0 40px;max-width:720px}
@media(max-width:860px){.app{grid-template-columns:1fr}.side{position:fixed;left:-250px;width:240px;z-index:30;transition:left .2s}.side.open{left:0}.top .menu{display:block}.main{padding:16px}.top{padding:10px 16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="root"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const CO={AURX:{n:'Aurex Industrial Ltd',sec:'Industrials',ind:'Capital goods',k:1,px:1240,ch:1.2,t:'Industrial'},BRVN:{n:'Brevon Machinery Ltd',sec:'Industrials',ind:'Capital goods',k:.7,px:688,ch:-0.8,t:'Industrial'},CELO:{n:'Celo Components Ltd',sec:'Industrials',ind:'Auto components',k:.5,px:312,ch:2.4,t:'Industrial',bad:1},NORB:{n:'Norbank Finance Ltd',sec:'Financials',ind:'Banks',k:1.4,px:905,ch:.3,t:'Bank'}};
const FY=['FY22','FY23','FY24','FY25','FY26'],QS=['Q1 FY26','Q2 FY26','Q3 FY26','Q4 FY26','Q1 FY27'];
const f=n=>Math.round(n).toLocaleString('en-IN'),p=n=>(n>=0?'+':'')+n.toFixed(1)+'%';
function data(s){const c=CO[s],k=c.k,rev=[820,910,1010,1090,1180].map(x=>x*k),ebm=[.17,.175,.18,.176,.172],npm=[.08,.085,.09,.088,.09],ocf=c.bad?[110,120,95,70,45]:[120,135,150,160,176],cap=[40,50,60,64,70];
const d={rev,ebitda:rev.map((r,i)=>r*ebm[i]),np:rev.map((r,i)=>r*npm[i]),ocf:ocf.map(x=>x*k),cap:cap.map(x=>x*k)};d.fcf=d.ocf.map((o,i)=>o-d.cap[i]);d.debt=[300,310,330,380,420].map(x=>x*k);d.eq=[500,560,630,700,780].map(x=>x*k);d.q=[290,298,305,311,322].map(x=>x*k);return d}
const chg=a=>(a[a.length-1]/a[a.length-2]-1)*100;
const st={co:'AURX',wl:['AURX','BRVN'],cmp:['AURX','BRVN','CELO'],chat:[],rep:[],tab:'inc',per:'FY',q:''};
const NAV=[['dashboard','Dashboard'],['search','Search'],['company','Research'],['statements','Statements'],['quarterly','Quarterly'],['compare','Compare'],['chat','AI assistant'],['flags','Red flags'],['reports','Reports'],['watchlist','Watchlist'],['settings','Settings']];
function chart(v,l,type){const w=360,h=150,m=Math.max(...v)*1.1,bw=w/v.length;let s=`<svg viewBox="0 0 ${w} ${h+22}" width="100%" role="img" aria-label="Chart of ${l.join(', ')}">`;
if(type=='line'){const pts=v.map((x,i)=>[bw*i+bw/2,h-x/m*h]);s+=`<polyline fill="none" stroke="var(--ac)" stroke-width="2.5" points="${pts.map(q=>q.join(',')).join(' ')}"/>`+pts.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="var(--ac)"/>`).join('')}
else s+=v.map((x,i)=>`<rect x="${bw*i+8}" y="${h-x/m*h}" width="${bw-16}" height="${x/m*h}" rx="4" fill="${x<0?'var(--dn)':'var(--ac)'}"/>`).join('');
return s+l.map((x,i)=>`<text x="${bw*i+bw/2}" y="${h+16}" text-anchor="middle" font-size="11" fill="var(--mu)">${x}</text>`).join('')+'</svg>'}
const demo='<div class="demo">Demonstration data. Fictional companies and sample figures (₹ crore), not real financials. No backend is connected yet.</div>';
const co=()=>CO[st.co];
function head(t,sub){return `<div class="row sp" style="margin-bottom:16px"><div><h2>${t}</h2><div class="mu">${sub||''}</div></div><select class="in" style="width:auto" data-act="pick" aria-label="Company">${Object.keys(CO).map(s=>`<option ${s==st.co?'selected':''} value="${s}">${CO[s].n}</option>`).join('')}</select></div>`}
function kpi(l,v,c,sub){return `<div class="card"><div class="mu">${l}</div><div class="big num">${v}</div><div class="${c>=0?'up':'dn'} num">${p(c)} <span class="mu">${sub||'YoY'}</span></div></div>`}
function tbl(h,rows){return `<div class="sc"><table class="t"><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td class="num">${x}</td>`).join('')}</tr>`).join('')}</table></div>`}
const P={
landing:()=>`<div class="land"><div class="row sp" style="padding:18px 0"><div class="logo">Fin<b>Sight</b> AI</div><div class="row"><a href="#login" class="btn g">Log in</a><a href="#signup" class="btn">Start researching</a></div></div>
<div class="hero"><h1>Research smarter. Invest informed.</h1><p class="mu" style="font-size:18px">Understand companies, analyse financial performance and uncover financial risks with your AI-powered research analyst.</p><div class="row"><a class="btn" href="#signup">Start researching</a><a class="btn g" href="#features">Explore features</a></div></div>
<div class="card" id="preview"><div class="mu" style="margin-bottom:8px">Product preview (demonstration data)</div>${chart(data('AURX').rev,FY,'bar')}</div>
<h2 id="features" style="margin:48px 0 16px">What you get</h2><div class="grid g2">${[['Statement analysis','Income statement, balance sheet and cash flow with every metric’s period, unit and formula shown.'],['Red flag detector','Research alerts such as profit rising while operating cash flow falls, with severity and limitations.'],['Source-backed AI chat','Answers separate verified facts, calculated metrics and interpretation.'],['Company comparison','Compare two to five companies in context, never ranked on one number.']].map(x=>`<div class="card"><h3>${x[0]}</h3><p class="mu">${x[1]}</p></div>`).join('')}</div>
<h2 style="margin:48px 0 16px">Pricing (hypotheses to validate)</h2><div class="grid g4">${[['Free','₹0'],['Starter','₹199'],['Pro','₹499'],['Premium','₹999']].map(x=>`<div class="card"><h3>${x[0]}</h3><div class="big">${x[1]}<span class="mu" style="font-size:14px">/month</span></div><a class="btn g sm" href="#signup">Choose ${x[0]}</a></div>`).join('')}</div>
<h2 style="margin:48px 0 16px">FAQ</h2>${[['Is this investment advice?','No. FinSight AI is for research and education and gives no buy, sell or hold recommendations.'],['Where does the data come from?','Each figure will carry its source and period. Until providers are connected, screens show labelled demonstration data.']].map(x=>`<details class="card" style="margin-bottom:8px"><summary>${x[0]}</summary><p class="mu">${x[1]}</p></details>`).join('')}
<p class="mu" style="margin-top:40px">For research and education only. Not investment advice. Contact: hello@finsight.example</p></div>`,
auth:m=>`<div class="land" style="max-width:420px;padding-top:60px"><div class="logo">Fin<b>Sight</b> AI</div><h2>${m=='login'?'Log in':'Create your account'}</h2><div class="demo" style="margin-top:12px">Preview only: sign-in is not connected to a backend yet, so this opens the demo workspace.</div>
<form data-act="auth" class="grid">${m=='signup'?'<input class="in" required placeholder="Full name" aria-label="Full name">':''}<input class="in" type="email" required placeholder="Email" aria-label="Email"><input class="in" type="password" required minlength="8" placeholder="Password (8+ characters)" aria-label="Password"><button class="btn">${m=='login'?'Log in':'Create account'}</button></form>
<p class="mu">${m=='login'?'New here? <a href="#signup">Create an account</a>':'Have an account? <a href="#login">Log in</a>'}</p></div>`,
dashboard:()=>{const d=data(st.co);return demo+`<div class="row sp"><h2>Good morning, Investor</h2><input class="in" style="max-width:320px" data-act="quick" placeholder="Search a company, then press Enter" aria-label="Quick search"></div>
<div class="grid g4" style="margin:16px 0">${['NIFTY 50','SENSEX','NIFTY BANK'].map(x=>`<div class="card"><div class="mu">${x}</div><div class="big">Not connected</div><span class="tag">Needs licensed market data</span></div>`).join('')}<div class="card"><div class="mu">Market status</div><div class="big">Unknown</div><span class="tag">No live feed</span></div></div>
<div class="grid g2"><div class="card"><div class="row sp"><h3>${co().n}: revenue</h3><span class="tag">Consolidated · ₹ crore</span></div>${chart(d.rev,FY,'bar')}<div class="up">${p(chg(d.rev))} YoY</div></div>
<div class="card"><div class="row sp"><h3>Watchlist</h3><a href="#watchlist">Manage</a></div>${st.wl.length?tbl(['Company','Price (sample)','Change'],st.wl.map(s=>[`<a href="#company" data-pick="${s}">${s}</a>`,'₹'+f(CO[s].px),`<span class="${CO[s].ch>=0?'up':'dn'}">${p(CO[s].ch)}</span>`])):'<div class="empty">No companies yet. Add one from search.</div>'}</div>
<div class="card"><h3>Quick actions</h3><div class="row" style="margin-top:10px"><a class="btn" href="#company">Analyse a company</a><a class="btn g" href="#compare">Compare</a><a class="btn g" href="#chat">Ask AI</a><a class="btn g" href="#reports">Upload annual report</a></div></div>
<div class="card"><h3>Recent analyses</h3>${st.rep.length?st.rep.map(r=>`<div>${r}</div>`).join(''):'<div class="empty">Nothing yet. Open a company to start.</div>'}</div></div>`},
search:()=>{const q=st.q.toLowerCase(),r=Object.entries(CO).filter(([s,c])=>!q||(s+c.n+c.sec+c.ind).toLowerCase().includes(q));
return demo+`<h2 style="margin-bottom:12px">Company search</h2><input class="in" data-act="q" value="${st.q}" placeholder="Name, symbol, sector or industry" aria-label="Search companies" autofocus>
<div style="margin-top:16px">${r.length?r.map(([s,c])=>`<div class="card row sp" style="margin-bottom:8px"><div><b>${c.n}</b><div class="mu">${s} · NSE · ${c.sec} · ${c.ind}</div></div><div class="row"><button class="btn g sm" data-act="wl" data-s="${s}">${st.wl.includes(s)?'Remove from watchlist':'Add to watchlist'}</button><a class="btn sm" href="#company" data-pick="${s}">Research</a></div></div>`).join(''):`<div class="empty"><b>No supported company matches “${st.q.replace(/</g,'')}”.</b><br>Financial data isn’t available for it yet. Try a symbol or sector.</div>`}</div>`},
company:()=>{const d=data(st.co),c=co();return demo+head(c.n,`${st.co} · ${c.sec} · ${c.ind}`)+`<div class="grid g4">${kpi('Revenue','₹'+f(d.rev[4]),chg(d.rev))+kpi('Net profit','₹'+f(d.np[4]),chg(d.np))+kpi('EBITDA margin',(d.ebitda[4]/d.rev[4]*100).toFixed(1)+'%',(d.ebitda[4]/d.rev[4]-d.ebitda[3]/d.rev[3])*100,'pts')+kpi('Debt-to-equity',(d.debt[4]/d.eq[4]).toFixed(2),(d.debt[4]/d.eq[4]/(d.debt[3]/d.eq[3])-1)*100)}</div>
<div class="grid g2" style="margin-top:16px"><div class="card"><h3>Net profit (₹ crore)</h3>${chart(d.np,FY,'line')}</div><div class="card"><h3>Operating cash flow (₹ crore)</h3>${chart(d.ocf,FY,'bar')}</div></div>
<div class="row" style="margin-top:16px"><a class="btn" href="#statements">Financial statements</a><a class="btn g" href="#quarterly">Quarterly</a><a class="btn g" href="#flags">Red flags</a><button class="btn g" data-act="wl" data-s="${st.co}">${st.wl.includes(st.co)?'Remove from watchlist':'Add to watchlist'}</button></div>`},
statements:()=>{const d=data(st.co),per=st.per=='FY'?FY:QS,fy=st.per=='FY',sel=a=>fy?a:a.slice(0,1).map(()=>0);
const rows={inc:[['Revenue',d.rev],['EBITDA',d.ebitda],['Net profit',d.np]],bal:[['Total debt',d.debt],['Total equity',d.eq]],cf:[['Operating cash flow',d.ocf],['Capex',d.cap],['Free cash flow',d.fcf]]}[st.tab];
const v=a=>fy?a:d.q.map((x,i)=>x*(a[4]/d.rev[4]));
return demo+head('Financial statements','Consolidated · ₹ crore · demonstration data')+`<div class="tabs">${[['inc','Income'],['bal','Balance sheet'],['cf','Cash flow']].map(x=>`<button class="${st.tab==x[0]?'on':''}" data-act="tab" data-v="${x[0]}">${x[1]}</button>`).join('')}<span style="flex:1"></span>${['FY','Q'].map(x=>`<button class="${st.per==x?'on':''}" data-act="per" data-v="${x}">${x=='FY'?'Annual':'Quarterly'}</button>`).join('')}</div>
<div class="card">${tbl(['Metric',...per,'Latest change'],rows.map(r=>{const a=v(r[1]);return [r[0],...a.map(f),`<span class="${chg(a)>=0?'up':'dn'}">${p(chg(a))}</span>`]}))}</div>
<div class="card" style="margin-top:16px"><h3>Free cash flow = operating cash flow − capex</h3><p class="mu">Source: sample dataset (not a filing). Statements are consolidated; standalone figures are never substituted.</p></div>`},
quarterly:()=>{const d=data(st.co),q=d.q;return demo+head('Quarterly results','Reported figures only. No analyst estimates are shown.')+`<div class="grid g2"><div class="card"><h3>Revenue (₹ crore)</h3>${chart(q,QS.map(x=>x.slice(0,2)),'bar')}</div><div class="card"><h3>Versus earlier quarters</h3>${tbl(['Quarter','Revenue','QoQ'],q.map((x,i)=>[QS[i],f(x),i?`<span class="up">${p((x/q[i-1]-1)*100)}</span>`:'n/a']))}</div></div>
<div class="card" style="margin-top:16px"><h3>What happened, improved, deteriorated</h3><p>Revenue rose ${p((q[4]/q[3]-1)*100)} from the previous quarter. Margin and cash-flow commentary will appear here once the AI service is connected.</p></div>`},
compare:()=>{const ids=st.cmp,m=[['Revenue growth',s=>p(chg(data(s).rev))],['Net margin',s=>{const d=data(s);return (d.np[4]/d.rev[4]*100).toFixed(1)+'%'}],['Debt-to-equity',s=>{const d=data(s);return (d.debt[4]/d.eq[4]).toFixed(2)}],['Free cash flow (₹ cr)',s=>f(data(s).fcf[4])]];
return demo+`<h2 style="margin-bottom:12px">Compare companies</h2><div class="row">${Object.keys(CO).map(s=>`<button class="tabs on" style="${ids.includes(s)?'':'opacity:.5'}" data-act="cmp" data-s="${s}">${s}</button>`).join('')}<span class="mu">Choose 2 to 5</span></div>
${ids.length<2?'<div class="empty">Select at least two companies to compare.</div>':`<div class="card">${tbl(['Metric',...ids],m.map(r=>[r[0],...ids.map(r[1])]))}</div><div class="card" style="margin-top:16px"><h3>Reading this table</h3><p class="mu">${ids.some(s=>CO[s].t=='Bank')&&ids.some(s=>CO[s].t!='Bank')?'Banks and industrial companies use different debt and cash-flow conventions, so these rows are not like-for-like.':'No single value decides a winner; weigh growth, margins and leverage together.'}</p></div>`}`},
chat:()=>demo+head('AI research assistant','Demo mode: replies are templated from sample data, no LLM is connected.')+`<div>${st.chat.length?st.chat.map(m=>`<div class="msg ${m.r}">${m.t}</div>`).join(''):'<div class="empty">Ask about growth, margins, leverage or cash flow.<div class="row" style="justify-content:center;margin-top:10px">'+['Is revenue growth turning into cash?','Is leverage rising?'].map(x=>`<button class="btn g sm" data-act="ask" data-v="${x}">${x}</button>`).join('')+'</div></div>'}</div>
<form data-act="chat" class="row" style="margin-top:12px"><input class="in" style="flex:1" name="q" placeholder="Ask about this company" aria-label="Question"><button class="btn">Send</button></form>`,
flags:()=>{const fl=flags(st.co);return demo+head('Financial red flags','Research alerts, not allegations or conclusions.')+(fl.length?fl.map(x=>`<div class="card flag ${x[1]}" style="margin-bottom:10px"><div class="row sp"><h3>${x[0]}</h3><span class="tag">${x[1]}</span></div><p>${x[2]}</p><p class="mu">Period: FY22–FY26 · Source: sample dataset · Limitation: context such as one-off capex isn’t checked.</p></div>`).join(''):'<div class="empty"><b>No flags raised for this company.</b><br>The sample rules found no unusual pattern.</div>')},
reports:()=>demo+head('Research reports','Saved reports appear here.')+`<div class="row" style="margin-bottom:12px"><button class="btn" data-act="gen">Generate report</button></div>${st.rep.length?st.rep.map((r,i)=>`<div class="card row sp" style="margin-bottom:8px"><div><b>${r}</b><div class="mu">Demo preview · generated ${new Date().toLocaleDateString('en-IN')}</div></div><button class="btn g sm" data-act="del" data-v="${i}">Delete</button></div>`).join(''):'<div class="empty">No reports yet. Generate one for the selected company.</div>'}<div class="card" style="margin-top:16px"><h3>Upload an annual report</h3><p class="mu">PDF only. Processing needs the backend, so selecting a file only checks it.</p><input type="file" accept="application/pdf" data-act="up" aria-label="Annual report PDF"></div>`,
watchlist:()=>demo+`<h2 style="margin-bottom:12px">Watchlist</h2>${st.wl.length?`<div class="card">${tbl(['Company','Price (sample)','Change','Action'],st.wl.map(s=>[`<a href="#company" data-pick="${s}">${CO[s].n}</a>`,'₹'+f(CO[s].px),`<span class="${CO[s].ch>=0?'up':'dn'}">${p(CO[s].ch)}</span>`,`<button class="btn g sm" data-act="wl" data-s="${s}">Remove</button>`]))}</div>`:'<div class="empty">Your watchlist is empty.<br><a href="#search">Search for a company</a> to add it.</div>'}`,
settings:()=>`<h2 style="margin-bottom:12px">Settings</h2><div class="grid g2"><form class="card grid" data-act="save"><h3>Profile</h3><input class="in" placeholder="Name" aria-label="Name"><select class="in" aria-label="Market"><option>India (NSE, BSE)</option></select><select class="in" aria-label="Currency"><option>INR ₹</option></select><select class="in" aria-label="Experience"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select><button class="btn">Save changes</button></form>
<div class="card grid"><h3>Appearance</h3><button class="btn g" data-act="theme">Switch to ${document.documentElement.dataset.theme=='light'?'dark':'light'} mode</button><h3>Plan</h3><div>Free · 3 analyses per month</div><button class="btn g" data-act="toast" data-v="Payments aren’t connected yet">Upgrade plan</button></div></div>`};
function flags(s){const d=data(s),o=[];if(chg(d.rev)>0&&chg(d.ocf)<0)o.push(['Revenue up, operating cash flow down','High',`Revenue grew ${p(chg(d.rev))} while operating cash flow changed ${p(chg(d.ocf))}.`]);if(d.fcf[4]<d.fcf[3]*.8)o.push(['Free cash flow deteriorating','Medium',`Free cash flow fell to ₹${f(d.fcf[4])} crore from ₹${f(d.fcf[3])} crore.`]);if(d.debt[4]/d.eq[4]>d.debt[3]/d.eq[3]*1.02)o.push(['Leverage rising','Low','Debt-to-equity increased year on year.']);return o}
function toast(t){$('#toast').innerHTML=`<div class="toast" role="status">${t}</div>`;setTimeout(()=>$('#toast').innerHTML='',2400)}
function route(){const h=(location.hash||'#landing').slice(1),r=document.getElementById('root');
if(['landing','features'].includes(h)){r.innerHTML=P.landing();if(h=='features')document.getElementById('features').scrollIntoView();return}
if(h=='login'||h=='signup'){r.innerHTML=P.auth(h);return}
const k=P[h]?h:'dashboard';r.innerHTML=`<div class="app"><aside class="side" id="side"><div class="logo">Fin<b>Sight</b> AI</div><nav class="nav">${NAV.map(n=>`<a href="#${n[0]}" class="${n[0]==k?'on':''}">${n[1]}</a>`).join('')}<small>Account</small><a href="#landing">Sign out</a></nav></aside><div><div class="top"><button class="btn g menu" data-act="menu" aria-label="Open navigation">Menu</button><b style="flex:1">${NAV.find(n=>n[0]==k)[1]}</b><span class="tag">Demo</span></div><main class="main" id="m"><div class="sk"></div><div class="sk"></div><div class="sk"></div></main></div></div>`;
setTimeout(()=>{const m=$('#m');if(m)try{m.innerHTML=P[k]()}catch(e){m.innerHTML='<div class="err"><b>Something went wrong loading this page.</b><br><button class="btn g sm" data-act="retry">Try again</button></div>'}},350)}
function paint(){const m=$('#m');if(m){const y=scrollY;m.innerHTML=P[(location.hash||'#dashboard').slice(1)]();scrollTo(0,y)}}
document.addEventListener('click',e=>{const a=e.target.closest('[data-act],[data-pick]');if(!a)return;const d=a.dataset;if(d.pick)st.co=d.pick;
({menu:()=>$('#side').classList.toggle('open'),retry:route,tab:()=>{st.tab=d.v;paint()},per:()=>{st.per=d.v;paint()},theme:()=>{const t=document.documentElement.dataset.theme=='light'?'dark':'light';document.documentElement.dataset.theme=t;paint()},toast:()=>toast(d.v),
wl:()=>{st.wl=st.wl.includes(d.s)?st.wl.filter(x=>x!=d.s):[...st.wl,d.s];toast(st.wl.includes(d.s)?'Added to watchlist':'Removed from watchlist');paint()},
cmp:()=>{const i=st.cmp.indexOf(d.s);if(i>-1){if(st.cmp.length<=2)return toast('Keep at least two companies');st.cmp.splice(i,1)}else if(st.cmp.length>=5)return toast('Compare up to five');else st.cmp.push(d.s);paint()},
gen:()=>{st.rep.unshift(co().n+': research report (demo)');toast('Demo report saved');paint()},del:()=>{st.rep.splice(+d.v,1);paint()},ask:()=>ask(d.v)}[d.act]||(()=>{}))()});
document.addEventListener('change',e=>{const a=e.target.dataset;if(a.act=='pick'){st.co=e.target.value;paint()}if(a.act=='up'){const x=e.target.files[0];if(x)toast(x.type=='application/pdf'&&x.size<25e6?'PDF accepted. Processing needs the backend.':'Choose a PDF under 25 MB')}});
document.addEventListener('input',e=>{if(e.target.dataset.act=='q'){st.q=e.target.value;const m=$('#m'),pos=e.target.selectionStart;paint();const i=$('#m input');i.focus();i.setSelectionRange(pos,pos)}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.dataset.act=='quick'){st.q=e.target.value;location.hash='#search'}});
document.addEventListener('submit',e=>{e.preventDefault();const a=e.target.dataset.act;if(a=='auth')location.hash='#dashboard';if(a=='save')toast('Changes saved');if(a=='chat'){const v=e.target.q.value.trim();if(v)ask(v)}});
function ask(v){const d=data(st.co),c=co();st.chat.push({r:'u',t:v.replace(/</g,'')},{r:'a',t:`<b>Verified (sample data):</b> FY26 revenue ₹${f(d.rev[4])} crore; operating cash flow ₹${f(d.ocf[4])} crore.<br><b>Calculated:</b> revenue ${p(chg(d.rev))}, operating cash flow ${p(chg(d.ocf))}, debt-to-equity ${(d.debt[4]/d.eq[4]).toFixed(2)}.<br><b>Interpretation:</b> ${chg(d.ocf)<chg(d.rev)?'cash flow is growing slower than revenue, worth monitoring.':'cash flow is keeping pace with revenue.'}<br><span class="mu">Demo reply for ${c.n}; no LLM or filings connected.</span>`});paint()}
addEventListener('hashchange',()=>{$('#side')&&$('#side').classList.remove('open');route();scrollTo(0,0)});
document.documentElement.dataset.theme='dark';route();
</script></body></html>
